<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - FreelanceHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --cream: #FAF8F4;
            --warm-white: #FFFEF9;
            --charcoal: #1C1917;
            --charcoal-soft: #292524;
            --muted: #78716C;
            --muted-light: #A8A29E;
            --accent: #D97706;
            --accent-light: #FEF3C7;
            --accent-mid: #F59E0B;
            --border: #E7E5E4;
            --border-strong: #D6D3D1;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--cream);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Left panel — decorative */
        .panel-left {
            width: 46%;
            background: var(--charcoal);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }

        .panel-left::before {
            content: '';
            position: absolute;
            top: -120px; right: -120px;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(217,119,6,0.25) 0%, transparent 70%);
        }

        .panel-left::after {
            content: '';
            position: absolute;
            bottom: -80px; left: -80px;
            width: 320px; height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245,158,11,0.15) 0%, transparent 70%);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 38px; height: 38px;
            background: var(--accent);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-size: 18px;
        }

        .brand-name {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: white;
            letter-spacing: -0.02em;
        }

        .panel-headline {
            position: relative; z-index: 1;
        }

        .panel-headline h2 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 2.8rem;
            color: white;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 1.25rem;
        }

        .panel-headline h2 em {
            font-style: normal;
            color: var(--accent-mid);
        }

        .panel-headline p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.5);
            line-height: 1.7;
            max-width: 300px;
        }

        .stats-row {
            display: flex;
            gap: 2.5rem;
            position: relative; z-index: 1;
        }

        .stat-item strong {
            display: block;
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
        }

        .stat-item span {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Right panel — form */
        .panel-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
        }

        .form-card {
            width: 100%;
            max-width: 420px;
        }

        .form-header {
            margin-bottom: 2.5rem;
        }

        .form-header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--charcoal);
            letter-spacing: -0.03em;
            margin-bottom: 0.4rem;
        }

        .form-header p {
            font-size: 0.9rem;
            color: var(--muted);
        }

        /* Flash messages */
        .flash {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flash-error {
            background: #FEF2F2;
            color: #B91C1C;
            border: 1px solid #FECACA;
        }

        .flash-success {
            background: #F0FDF4;
            color: #166534;
            border: 1px solid #BBF7D0;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--charcoal-soft);
            margin-bottom: 0.5rem;
            letter-spacing: 0.01em;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted-light);
            font-size: 14px;
            pointer-events: none;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.75rem;
            background: var(--warm-white);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            color: var(--charcoal);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(217,119,6,0.12);
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--muted-light);
        }

        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            background: var(--charcoal);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Syne', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            background: var(--accent);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 1.75rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            font-size: 0.78rem;
            color: var(--muted-light);
        }

        .form-footer {
            text-align: center;
            margin-top: 1.75rem;
        }

        .form-footer p {
            font-size: 0.875rem;
            color: var(--muted);
        }

        .form-footer a {
            color: var(--accent);
            font-weight: 500;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        /* Animate in */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .form-card { animation: fadeUp 0.45s ease both; }
        .panel-left .panel-headline { animation: fadeUp 0.5s 0.1s ease both; }
        .panel-left .stats-row { animation: fadeUp 0.5s 0.2s ease both; }
    </style>
</head>
<body>

<!-- Left decorative panel -->
<div class="panel-left">
    <div class="brand">
        <div class="brand-icon"><i class="fas fa-bolt"></i></div>
        <span class="brand-name">FreelanceHub</span>
    </div>

    <div class="panel-headline">
        <h2>La plateforme des <em>talents</em> indépendants.</h2>
        <p>Connectez-vous à votre espace et retrouvez vos missions, vos clients et vos opportunités.</p>
    </div>

    <div class="stats-row">
        <div class="stat-item">
            <strong>12k+</strong>
            <span>Freelances</span>
        </div>
        <div class="stat-item">
            <strong>3.4k</strong>
            <span>Missions actives</span>
        </div>
        <div class="stat-item">
            <strong>98%</strong>
            <span>Satisfaction</span>
        </div>
    </div>
</div>

<!-- Right form panel -->
<div class="panel-right">
    <div class="form-card">
        <div class="form-header">
            <h1>Connexion</h1>
            <p>Ravi de vous revoir 👋</p>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="flash flash-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error}" class="flash flash-error">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Adresse email</label>
                <div class="input-wrap">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" name="email" required placeholder="votre@email.com">
                </div>
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <div class="input-wrap">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn-primary">
                Se connecter <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="divider"><span>ou</span></div>

        <div class="form-footer">
            <p>Pas encore de compte ? <a th:href="@{/register}">Créer un compte</a></p>
        </div>
    </div>
</div>

</body>
</html>
