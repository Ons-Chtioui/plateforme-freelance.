<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Modifier mon Entreprise</title>
</head>
<body>
    <main>
        <div class="max-w-3xl mx-auto">
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-900">
                    <i class="fas fa-edit text-indigo-600 mr-3"></i>
                    Modifier mon Entreprise
                </h1>
                <p class="text-gray-600 mt-2">Mettez à jour les informations de votre entreprise</p>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-8">
                <form th:action="@{/entrepreneur/entreprise/modifier}" method="post" class="space-y-6">
                    <input type="hidden" name="entrepriseId" th:value="${entreprise.id}">
                    
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">
                            <i class="fas fa-building mr-2 text-indigo-600"></i>
                            Nom de l'entreprise *
                        </label>
                        <input type="text" name="nom" th:value="${entreprise.nom}" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>

                    <div>
                        <label class="block text-gray-700 font-bold mb-2">
                            <i class="fas fa-industry mr-2 text-indigo-600"></i>
                            Secteur d'activité *
                        </label>
                        <input type="text" name="secteurActivite" th:value="${entreprise.secteurActivite}" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>

                    <div>
                        <label class="block text-gray-700 font-bold mb-2">
                            <i class="fas fa-globe mr-2 text-indigo-600"></i>
                            Site web
                        </label>
                        <input type="url" name="siteWeb" th:value="${entreprise.siteWeb}"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                               placeholder="https://www.example.com">
                    </div>

                    <div>
                        <label class="block text-gray-700 font-bold mb-2">
                            <i class="fas fa-align-left mr-2 text-indigo-600"></i>
                            Description de l'entreprise
                        </label>
                        <textarea name="description" rows="5" th:text="${entreprise.description}"
                                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                  placeholder="Décrivez votre entreprise, ses activités, ses valeurs..."></textarea>
                    </div>

                    <div class="flex justify-end space-x-3 pt-4 border-t">
                        <a th:href="@{/entrepreneur/dashboard}" 
                           class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold px-6 py-3 rounded-lg transition">
                            <i class="fas fa-times mr-2"></i> Annuler
                        </a>
                        <button type="submit" 
                                class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-3 rounded-lg transition transform hover:scale-105">
                            <i class="fas fa-save mr-2"></i> Enregistrer les modifications
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
