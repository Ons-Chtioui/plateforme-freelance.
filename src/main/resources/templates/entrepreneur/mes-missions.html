<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Missions - FreelanceHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a th:href="@{/entrepreneur/dashboard}" class="flex items-center">
                        <i class="fas fa-briefcase text-indigo-600 text-2xl mr-2"></i>
                        <span class="text-xl font-bold text-gray-800">FreelanceHub</span>
                    </a>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="text-gray-600" th:text="${utilisateur.email}">user@example.com</span>
                    <a th:href="@{/logout}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md">
                        <i class="fas fa-sign-out-alt mr-1"></i> Déconnexion
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">
                    <i class="fas fa-tasks text-indigo-600 mr-3"></i>
                    Mes Missions
                </h1>
                <p class="text-gray-600 mt-2">Gérez toutes vos missions publiées</p>
            </div>
            <a th:href="@{/entrepreneur/missions/ajouter}" 
               class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg transition">
                <i class="fas fa-plus mr-2"></i> Nouvelle Mission
            </a>
        </div>

        <!-- Liste missions -->
        <div th:if="${#lists.isEmpty(missions)}" class="bg-white rounded-xl shadow-md p-12 text-center">
            <i class="fas fa-inbox text-gray-400 text-6xl mb-4"></i>
            <p class="text-gray-700 font-medium text-lg">Aucune mission publiée</p>
            <a th:href="@{/entrepreneur/missions/ajouter}" 
               class="inline-block mt-4 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg">
                <i class="fas fa-plus mr-2"></i> Créer ma première mission
            </a>
        </div>

        <div class="grid grid-cols-1 gap-6" th:unless="${#lists.isEmpty(missions)}">
            <div th:each="mission : ${missions}" 
                 class="bg-white rounded-xl shadow-md hover:shadow-lg transition p-6">
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold text-gray-900 mb-2" th:text="${mission.titre}">Titre</h3>
                        <p class="text-gray-600 mb-4 line-clamp-3" th:text="${mission.description}">Description...</p>
                        
                        <!-- Compétences -->
                        <div class="mb-4" th:if="${#lists.size(mission.competences) > 0}">
                            <div class="flex flex-wrap gap-2">
                                <span th:each="comp : ${mission.competences}" 
                                      class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-sm">
                                    <span th:text="${comp.nom}">Compétence</span>
                                </span>
                            </div>
                        </div>

                        <!-- Stats -->
                        <div class="flex items-center space-x-6">
                            <span class="text-green-600 font-bold text-lg">
                                <i class="fas fa-euro-sign mr-1"></i>
                                <span th:text="${#numbers.formatDecimal(mission.budget, 0, 'COMMA', 2, 'POINT')}">5000</span> €
                            </span>
                            
                            <span class="text-gray-600">
                                <i class="fas fa-paper-plane mr-1"></i>
                                <span th:text="${#lists.size(mission.candidatures)}">0</span> candidature(s)
                            </span>

                            <span th:if="${mission.active}" class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-bold">
                                <i class="fas fa-check-circle mr-1"></i> Active
                            </span>
                            <span th:unless="${mission.active}" class="bg-gray-300 text-gray-700 px-3 py-1 rounded-full text-sm font-bold">
                                <i class="fas fa-times-circle mr-1"></i> Inactive
                            </span>
                        </div>
                    </div>

                    <div class="ml-6">
                        <a th:href="@{/entrepreneur/mission/{id}/candidatures(id=${mission.id})}" 
                           class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg transition block text-center">
                            <i class="fas fa-users mr-2"></i> Voir les candidats
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
