<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Créer mon Entreprise</title>
</head>
<body>
    <main>
        <div class="max-w-3xl mx-auto">
            <div class="mb-8 text-center">
                <i class="fas fa-building text-indigo-600 text-6xl mb-4"></i>
                <h1 class="text-3xl font-bold text-gray-900">Créer mon Entreprise</h1>
                <p class="text-gray-600 mt-2">Renseignez les informations de votre entreprise pour commencer à publier des missions</p>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-8">
                <form th:action="@{/entrepreneur/creer-entreprise}" method="post" class="space-y-6">
                    
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">
                            <i class="fas fa-building mr-2 text-indigo-600"></i>
                            Nom de l'entreprise *
                        </label>
                        <input type="text" name="nom" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                               placeholder="Ex: TechSolutions SARL">
                    </div>

                    <div>
                        <label class="block text-gray-700 font-bold mb-2">
                            <i class="fas fa-industry mr-2 text-indigo-600"></i>
                            Secteur d'activité *
                        </label>
                        <input type="text" name="secteurActivite" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                               placeholder="Ex: Technologies de l'information, E-commerce, Consulting...">
                    </div>

                    <div>
                        <label class="block text-gray-700 font-bold mb-2">
                            <i class="fas fa-globe mr-2 text-indigo-600"></i>
                            Site web
                        </label>
                        <input type="url" name="siteWeb"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                               placeholder="https://www.example.com">
                    </div>

                    <div>
                        <label class="block text-gray-700 font-bold mb-2">
                            <i class="fas fa-align-left mr-2 text-indigo-600"></i>
                            Description de l'entreprise
                        </label>
                        <textarea name="description" rows="5"
                                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                  placeholder="Décrivez votre entreprise, ses activités, ses valeurs..."></textarea>
                    </div>

                    <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-4">
                        <p class="text-indigo-800 text-sm">
                            <i class="fas fa-info-circle mr-2"></i>
                            <strong>Important :</strong> Vous ne pouvez créer qu'une seule entreprise par compte entrepreneur.
                            Ces informations seront visibles par les freelances lorsqu'ils consulteront vos missions.
                        </p>
                    </div>

                    <div class="flex justify-end space-x-3 pt-4 border-t">
                        <button type="submit" 
                                class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-3 rounded-lg transition transform hover:scale-105">
                            <i class="fas fa-check mr-2"></i> Créer mon entreprise
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
