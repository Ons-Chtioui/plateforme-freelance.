<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Entreprises - FreelanceHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a th:href="@{/admin/dashboard}" class="flex items-center">
                        <i class="fas fa-briefcase text-indigo-600 text-2xl mr-2"></i>
                        <span class="text-xl font-bold text-gray-800">FreelanceHub Admin</span>
                    </a>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="text-gray-600" th:text="${utilisateur.email}">admin@example.com</span>
                    <a th:href="@{/logout}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md">
                        <i class="fas fa-sign-out-alt mr-1"></i> Déconnexion
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">
                <i class="fas fa-building text-green-600 mr-3"></i>
                Gestion des Entreprises
            </h1>
            <p class="text-gray-600 mt-2">Liste de toutes les entreprises enregistrées</p>
        </div>

        <!-- Liste entreprises -->
        <div th:if="${#lists.isEmpty(entreprises)}" class="bg-white rounded-xl shadow-md p-12 text-center">
            <i class="fas fa-inbox text-gray-400 text-6xl mb-4"></i>
            <p class="text-gray-700 font-medium">Aucune entreprise enregistrée</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" th:unless="${#lists.isEmpty(entreprises)}">
            <div th:each="entreprise : ${entreprises}" 
                 class="bg-white rounded-xl shadow-md hover:shadow-lg transition p-6">
                <div class="flex justify-between items-start mb-4">
                    <div class="flex-1">
                        <h3 class="text-xl font-bold text-gray-900" th:text="${entreprise.nom}">Nom Entreprise</h3>
                        <p class="text-gray-600 text-sm mt-1">
                            <i class="fas fa-industry mr-1"></i>
                            <span th:text="${entreprise.secteurActivite}">Secteur</span>
                        </p>
                    </div>
                    <div class="bg-green-100 p-3 rounded-lg">
                        <i class="fas fa-building text-green-600 text-2xl"></i>
                    </div>
                </div>

                <!-- Entrepreneur -->
                <div class="mb-4 pb-4 border-b">
                    <p class="text-sm text-gray-600">Entrepreneur :</p>
                    <p class="text-gray-900 font-medium" th:text="${entreprise.entrepreneur.email}">email</p>
                </div>

                <!-- Site web -->
                <div class="mb-4" th:if="${entreprise.siteWeb != null}">
                    <a th:href="${entreprise.siteWeb}" target="_blank" 
                       class="text-indigo-600 hover:text-indigo-800 text-sm">
                        <i class="fas fa-external-link-alt mr-1"></i>
                        <span th:text="${entreprise.siteWeb}">www.example.com</span>
                    </a>
                </div>

                <!-- Description -->
                <p class="text-gray-700 text-sm mb-4 line-clamp-3" th:if="${entreprise.description != null}" 
                   th:text="${entreprise.description}">Description...</p>

                <!-- Stats -->
                <div class="flex items-center justify-between pt-4 border-t">
                    <span class="text-sm text-gray-600">
                        <i class="fas fa-tasks mr-1"></i>
                        <span th:text="${#lists.size(entreprise.missions)}">0</span> mission(s)
                    </span>

                    <form th:action="@{/admin/entreprise/{id}/supprimer(id=${entreprise.id})}" method="post" 
                          onsubmit="return confirm('Êtes-vous sûr de vouloir supprimer cette entreprise ?');">
                        <button type="submit" 
                                class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-2 rounded-lg transition">
                            <i class="fas fa-trash mr-1"></i> Supprimer
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="mt-6 text-center">
            <p class="text-gray-600">
                <i class="fas fa-info-circle mr-2"></i>
                Total : <span class="font-bold" th:text="${#lists.size(entreprises)}">0</span> entreprise(s)
            </p>
        </div>
    </main>
</body>
</html>
