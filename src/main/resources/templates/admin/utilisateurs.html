<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Utilisateurs - FreelanceHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a th:href="@{/admin/dashboard}" class="flex items-center">
                        <i class="fas fa-briefcase text-indigo-600 text-2xl mr-2"></i>
                        <span class="text-xl font-bold text-gray-800">FreelanceHub Admin</span>
                    </a>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="text-gray-600" th:text="${utilisateur.email}">admin@example.com</span>
                    <a th:href="@{/logout}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md">
                        <i class="fas fa-sign-out-alt mr-1"></i> Déconnexion
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">
                <i class="fas fa-users text-indigo-600 mr-3"></i>
                Gestion des Utilisateurs
            </h1>
            <p class="text-gray-600 mt-2">Liste de tous les utilisateurs de la plateforme</p>
        </div>

        <!-- Tableau utilisateurs -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Utilisateur
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Email
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Rôle
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Actions
                        </th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="user : ${utilisateurs}">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <div class="flex-shrink-0 h-10 w-10">
                                    <div class="h-10 w-10 rounded-full bg-indigo-100 flex items-center justify-center">
                                        <i class="fas fa-user text-indigo-600"></i>
                                    </div>
                                </div>
                                <div class="ml-4">
                                    <div class="text-sm font-medium text-gray-900" th:if="${user.profil != null}" 
                                         th:text="${user.profil.nomComplet}">Nom Prénom</div>
                                    <div class="text-sm text-gray-500" th:unless="${user.profil != null}">Profil non créé</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900" th:text="${user.email}">email@example.com</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span th:if="${user.role.name() == 'ADMIN'}" 
                                  class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-purple-100 text-purple-800">
                                <i class="fas fa-shield-alt mr-1"></i> ADMIN
                            </span>
                            <span th:if="${user.role.name() == 'ENTREPRENEUR'}" 
                                  class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                <i class="fas fa-building mr-1"></i> ENTREPRENEUR
                            </span>
                            <span th:if="${user.role.name() == 'FREELANCE'}" 
                                  class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                                <i class="fas fa-laptop-code mr-1"></i> FREELANCE
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <form th:action="@{/admin/utilisateur/{id}/supprimer(id=${user.id})}" method="post" 
                                  onsubmit="return confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur ?');" style="display: inline;">
                                <button type="submit" th:if="${user.role.name() != 'ADMIN'}"
                                        class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1 rounded transition">
                                    <i class="fas fa-trash mr-1"></i> Supprimer
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-6 text-center">
            <p class="text-gray-600">
                <i class="fas fa-info-circle mr-2"></i>
                Total : <span class="font-bold" th:text="${#lists.size(utilisateurs)}">0</span> utilisateur(s)
            </p>
        </div>
    </main>
</body>
</html>
