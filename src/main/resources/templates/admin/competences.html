<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Gestion des Compétences</title>
</head>
<body>
    <main>
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">
                <i class="fas fa-code text-purple-600 mr-3"></i>
                Gestion des Compétences
            </h1>
            <p class="text-gray-600 mt-2">Gérez les compétences disponibles sur la plateforme</p>
        </div>

        <!-- Formulaire d'ajout -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-xl font-bold text-gray-900 mb-4">
                <i class="fas fa-plus-circle text-indigo-600 mr-2"></i>
                Ajouter une compétence
            </h2>
            
            <form th:action="@{/admin/competences/ajouter}" method="post" class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <input type="text" name="nom" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                           placeholder="Nom de la compétence (ex: Java, React, Design UX...)">
                </div>
                
                <div class="flex-1">
                    <input type="text" name="description"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                           placeholder="Description (optionnelle)">
                </div>
                
                <button type="submit" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg transition whitespace-nowrap">
                    <i class="fas fa-plus mr-2"></i> Ajouter
                </button>
            </form>
        </div>

        <!-- Liste des compétences -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-bold text-gray-900 mb-6">
                <i class="fas fa-list text-indigo-600 mr-2"></i>
                Liste des compétences (<span th:text="${#lists.size(competences)}">0</span>)
            </h2>

            <div th:if="${#lists.isEmpty(competences)}" class="text-center py-12">
                <i class="fas fa-inbox text-gray-400 text-6xl mb-4"></i>
                <p class="text-gray-600">Aucune compétence enregistrée</p>
            </div>

            <div th:unless="${#lists.isEmpty(competences)}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div th:each="comp : ${competences}" 
                     class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition bg-gradient-to-br from-white to-gray-50">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="text-lg font-bold text-gray-900" th:text="${comp.nom}">Nom</h3>
                            <p class="text-sm text-gray-600 mt-1" th:if="${comp.description != null}" th:text="${comp.description}">Description</p>
                            
                            <!-- Statistiques -->
                            <div class="mt-3 flex items-center space-x-4 text-sm">
                                <span class="text-indigo-600">
                                    <i class="fas fa-briefcase mr-1"></i>
                                    <span th:text="${#lists.size(comp.missions)}">0</span> mission(s)
                                </span>
                                <span class="text-green-600">
                                    <i class="fas fa-users mr-1"></i>
                                    <span th:text="${#lists.size(comp.profils)}">0</span> profil(s)
                                </span>
                            </div>
                        </div>

                        <!-- Bouton supprimer -->
                        <form th:action="@{/admin/competence/{id}/supprimer(id=${comp.id})}" method="post" 
                              onsubmit="return confirm('Êtes-vous sûr de vouloir supprimer cette compétence ?');">
                            <button type="submit" 
                                    class="bg-red-100 hover:bg-red-200 text-red-700 p-2 rounded-lg transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
